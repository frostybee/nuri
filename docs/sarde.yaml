site:
  title: "Nuri"
  description: "Shiki-fidelity syntax highlighting for Go: 257 languages, 65 themes, no CGO"
  url: "https://frostybee.github.io"
  # Page paths are appended relative to the content dir, so this must end at docs/content.
  edit_url: "https://github.com/frostybee/nuri/edit/main/docs/content"
  # The favicon art is the reduced variant of nuri.svg, drawn to stay legible at
  # small sizes, so it doubles as the header logo. Its own dark rounded-square
  # background means one image works in both themes. Alt is left empty because
  # the site title beside it already names the link.
  logo: "/favicon.svg"
  favicon: "/favicon.svg"
build:
  base_path: /nuri/
theme:
  preset: "docs"
  dark: true
  font_family: "'Inter', system-ui, -apple-system, sans-serif"

  # preset: "ocean"        # Try: ocean, forest, rose, clean, minimal, docs, academic
  # overrides:
  #   primary: "#6366f1"

social:
- icon: github
  label: GitHub
  url: https://github.com/frostybee/nuri

collections:
  docs:
    sort: "order"
    tabs: false
    sidebar:
      collapsed_by_default: true
toc:
  enabled: true
  max_level: 4
  min_level: 2
header:
  links:
  - label: Tags
    url: /tags/
  - label: Changelog
    url: /docs/changelog
  search: true
  social: true
  theme_toggle: true
markdown:
  github_alerts: true
  katex: true
  mermaid: true
  triple_colon_callouts: true
  typographer: true
  unsafe: false
  codeblocks:
    engine: nuri
    light_theme: "github-light"
    dark_theme: "github-dark-default"

head:
  custom_css:
    - css/custom.css

plugins:
  # This list REPLACES Sarde's defaults rather than extending them, so every
  # default plugin has to be restated. Dropping one silently disables it.
  enabled:
    - search
    - seo
    - sitemap
    - robots
    - rss
    - atom
    - content_lint
    - link_validator
    - redirects
    - llms_txt
    - katex
    - mermaid
    - social_cards
    - scroll-to-top
    - keyboard-nav
  config:
    social_cards:
      # Brand palette from nuri-logo.svg: panel navy background, brush-trail
      # gradient red to purple for the accent strip. The PNGs are rasterized
      # from the masters in brand/ (cards cannot use SVG directly); the
      # watermark is the bare favicon variant, whose grey bars recede into
      # the navy background leaving the highlighted lines and brush stroke.
      bg_color: "#1a1f35"
      accent_color: "#ff7b72"
      accent_color_2: "#d2a8ff"
      logo: "/images/nuri-mark.png"
      watermark: true
      watermark_image: "/images/nuri-watermark.png"
    scroll-to-top:
      showProgressRing: true
      showTooltip: true
    keyboard-nav:
      # Keep arrow-key navigation, drop the on-load hint toast and the
      # chevron arrows pinned to the viewport edges.
      show_hint: false
      show_side_nav: true

homepage:
  hero:
    title: "Nuri"
    subtitle: "A pure Go port of Shiki. TextMate grammars, VS Code themes, and byte-identical output without CGO."
    background: gradient
    cta:
      label: "Get Started"
      url: "/docs/getting-started"
    secondary_cta:
      label: "Read the Docs"
      url: "/docs/introduction"
    image:
      light: /images/nuri.svg
      dark: /images/nuri.svg
      alt: "Nuri"
