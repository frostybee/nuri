name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages rejects overlapping deployments, so queue runs instead of racing them.
# Never cancel in progress: a half-deployed site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required. Sarde's build.last_updated defaults to the
      # "git" strategy, which reads each page's last commit time. A shallow
      # clone makes every page report the same timestamp.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/configure-pages@v5

      # No build-args: docs/sarde.yaml already sets site.url and
      # base_path: /nuri/. --baseURL overrides site.url rather than the path
      # prefix, so passing it here would corrupt canonical links, OG tags, the
      # sitemap, and the feeds.
      - uses: getsarde/action@v1
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
